name: '[CDM] Build and test'

on:
  workflow_call:
    inputs:
      static-build:
        type: boolean
        required: true
      upload:
        type: boolean
        required: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04,  macos-26, windows-2025]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Clone cdm-devkit
        run: |
          git clone --depth 1 https://github.com/cdm-processors/cdm-devkit.git cdm-devkit
      - name: Install `cdm-devkit` package
        run: pip install -e cdm-devkit
      - name: Build cdm-devkit
        run: |
          cd cdm-devkit
          poetry build
      - name: Enable MSVC Dev (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Remove GNU Link (Windows)
        if: runner.os == 'Windows'
        run: |
          rm /usr/bin/link
      - name: Build LLVM (static linking)
        if: inputs.static-build && runner.os == 'Linux'
        run: |
          ./llvm/utils/cdm/build.py --static -j 2 -v
      - name: Build LLVM (dynamic linking)
        if: ${{ !(inputs.static-build && runner.os == 'Linux') }}
        run: |
          ./llvm/utils/cdm/build.py -j 2 -v
      - name: Run end-to-end tests
        if: runner.os != 'Windows' ## TODO: Enable when test system is updated
        run: make -C llvm/test_cdm CLANG=$(realpath llvm/build/bin/clang) test
      - name: Run lit tests (POSIX)
        if: runner.os != 'Windows'
        run: ./llvm/build/bin/llvm-lit ./llvm/test/CodeGen/CDM
      - name: Run lit tests (Windows)
        if: runner.os == 'Windows'
        run: python3 ./llvm/build/bin/llvm-lit.py ./llvm/test/CodeGen/CDM
      - name: Compress artifacts (tarball)
        if: inputs.upload && (runner.os != 'Windows')
        run: |
          OS=${{ runner.os }}
          cd llvm/build && tar -czvf \
            cdm16-llvm-$(echo $OS | tr '[:upper:]' '[:lower:]')-$(uname -m).tar.gz \
            bin
      - name: Compress artifacts (zip.. ball?)
        if: inputs.upload && (runner.os == 'Windows')
        run: |
          cd llvm/build && tar -a -c -f cdm16-llvm-windows-$(uname -m).zip bin
      - name: Upload artifacts
        if: inputs.upload
        uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: ${{ matrix.os }}
          path: |
            ./llvm/build/*.tar.gz
            ./llvm/build/*.zip
