name: '[CDM] Run tests'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04,  macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Clone cdm-devkit
        run: git clone --depth 1 https://github.com/cdm-processors/cdm-devkit.git cdm-devkit
      - name: Install `cdm-devkit` package
        run: |
              pip install -e cdm-devkit
      - name: Build cdm-devkit
        run: |
              cd cdm-devkit
              poetry build
      - name: Build LLVM
        run: ./llvm//utils/cdm/build.py -j 2 -use-ninja -verbose
      - name: Run end-to-end tests
        run: make -C llvm/test_cdm CLANG=$(realpath llvm/build/bin/clang) test
      - name: Run lit tests
        run: ./llvm/build/bin/llvm-lit ./llvm/test/CodeGen/CDM
      - name: Upload artifacts
        # Don't fail the job when upload-artifacts fails.
        # This is a known GitHub issue: https://github.com/actions/upload-artifact/issues/569
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clang-cdm-${{ matrix.os }}
          path: ./llvm/build
